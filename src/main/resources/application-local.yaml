app:
  services:
    auth-uri: ${AUTH_SERVICE_URI:http://localhost:8082}
    user-uri: ${USER_SERVICE_URI:http://localhost:8081}

  rate-limit:
    replenish-rate: ${RATE_LIMIT_REPLENISH_RATE:10}
    burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:20}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI}