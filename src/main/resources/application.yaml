spring:
  application:
    name: api-gateway

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwks-uri: ${AUTH_JWKS_URI}

  services:
    auth-uri: ${AUTH_SERVICE_URI}
    user-uri: ${USER_SERVICE_URI}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never