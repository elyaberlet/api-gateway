spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI}

server:
  port: ${SERVER_PORT:8080}

app:
  services:
    auth-uri: ${AUTH_SERVICE_URI}
    user-uri: ${USER_SERVICE_URI}

  rate-limit:
    replenish-rate: ${RATE_LIMIT_REPLENISH_RATE:10}
    burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:20}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never